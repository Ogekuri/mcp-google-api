# Release (npm): ONE integrated release process — branch gate, pre-built artifact
# resolution, npm publish, changelog, GitHub Release — all in a single workflow job
# (PKG-027). Triggered only by canonical version tags (PKG-008); branch pushes and
# pull requests never start it. The branch gate is the first release step: it
# resolves the tagged commit's reachability from origin/master and origin/develop
# (PKG-009) and fails the run before any artifact resolution, publish, or
# release-creation step when neither branch contains the tag (PKG-028).
#
# This automation CONSUMES the release artifact prepared locally: the local release
# build script compiles `dist/cli.js`, packs and validates the tarball
# `dist/mcp-google-api-<version>.tgz`, and removes the bundle, leaving only the
# version-controlled tarball in `dist/` (PKG-102, PKG-134, PKG-135). The workflow
# runs no dependency install, no build, no pack, and no verification script
# (PKG-110): it verifies that the pre-built tarball is non-empty and part of the
# tagged commit through `git cat-file` (PKG-111) and publishes exactly that file
# (PKG-113).
#
# npm publication runs only when the tag is reachable from origin/master
# (PKG-042); tags reachable from develop but not master create the GitHub Release
# without publishing to npm (PKG-043). npm publication disables lifecycle scripts
# (PKG-112), so no rebuild can happen inside automation; authentication uses OIDC
# Trusted Publishing (PKG-010): the job grants `id-token: write` (PKG-030), no
# publish-token secret or publish-token environment variable is configured
# (PKG-031), and the pinned Node.js runtime bundles npm >= 11.5.1, the OIDC
# Trusted Publishing floor (PKG-032).
name: Release (npm)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version push (e.g. v1.2.3), no pre-release

permissions:
  contents: write
  id-token: write  # Required for npm OIDC Trusted Publishing (PKG-030)
  attestations: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  # Single integrated release process (PKG-027): the branch gate, pre-built
  # artifact resolution, npm publish, changelog, and GitHub Release all run in
  # this one job — no parallel or separate release jobs exist.
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Branch gate (PKG-009): integrated as the first release step of the single
      # release job. The gate resolves the tagged commit's reachability from
      # origin/master and origin/develop and exports both outcomes as step
      # outputs consumed by the publish step. A version tag reachable from
      # neither branch fails here with exit 1, before any artifact resolution,
      # publish, or release-creation step runs (PKG-028). npm publication runs
      # only for master-reachable tags (PKG-042); develop-only tags create the
      # GitHub Release without publishing to npm (PKG-043).
      - name: Check tag branch (master or develop)
        id: branch_gate
        run: |
          git fetch origin master develop
          on_master=false
          on_develop=false
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            on_master=true
          fi
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/develop"; then
            on_develop=true
          fi
          echo "on_master=${on_master}" >> "$GITHUB_OUTPUT"
          echo "on_develop=${on_develop}" >> "$GITHUB_OUTPUT"
          if [ "${on_master}" = "false" ] && [ "${on_develop}" = "false" ]; then
            echo "::error::Tag ${{ github.ref }} is reachable from neither origin/master nor origin/develop. Release packing runs only for master or develop version tags (PKG-008, PKG-009, PKG-028); no artifact is packed and no release is created."
            exit 1
          fi
          if [ "${on_master}" = "true" ]; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release including npm publish (PKG-042)."
          else
            echo "📦 Tag ${{ github.ref }} is on develop branch only. Proceeding with release without npm publish (PKG-043)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      # Pre-built release artifact resolution (PKG-110, PKG-111). The tarball is
      # prepared locally by the release build script, committed with the release changes,
      # and tagged. The workflow runs no dependency install, no build, no pack,
      # and no verification script: it resolves the expected artifact path from
      # the package version, rejects a missing or empty file, and proves through
      # `git cat-file` that the file belongs to the tagged commit.
      - name: Resolve pre-built release artifact
        id: prebuilt
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="dist/mcp-google-api-${version}.tgz"
          if [ ! -s "${artifact}" ]; then
            echo "::error::Missing pre-built release artifact ${artifact} in the tagged commit. Run the local release packaging step and commit the generated dist tarball before tagging."
            exit 1
          fi
          git cat-file -e "${GITHUB_SHA}:${artifact}"
          echo "artifact_path=${artifact}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$(basename "${artifact}")" >> "$GITHUB_OUTPUT"
          echo "Pre-built release artifact: ${artifact}"

      # Release asset set (PKG-126, PKG-128): exactly the committed tarball,
      # resolved above, is published and attached. Repository sources are never
      # release artifacts, so no source archive may appear in the release tree.
      - name: Verify release asset set
        run: |
          artifact="${{ steps.prebuilt.outputs.artifact_path }}"
          tarball_count="$(find dist -maxdepth 1 -type f -name '*.tgz' -print | wc -l)"
          if [ "${tarball_count}" -ne 1 ]; then
            echo "::error::Expected exactly one committed release tarball (${artifact}), found ${tarball_count} (PKG-126, PKG-128)."
            exit 1
          fi
          source_archives="$(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' \) -print)"
          if [ -n "${source_archives}" ]; then
            echo "::error::Repository sources are not release artifacts; the release asset set must hold only ${artifact} (PKG-126, PKG-128): ${source_archives}"
            exit 1
          fi
          echo "Release asset set verified: ${artifact}"

      # npm publish runs only when the branch gate resolved the tag as
      # reachable from origin/master (PKG-042); develop-only tags skip this step
      # and complete the release without npm publication (PKG-043). The published
      # package is exactly the committed tarball resolved above — no repacking
      # (PKG-113) — and lifecycle scripts stay disabled (PKG-112).
      # npm OIDC Trusted Publishing (PKG-010): authentication is minted from
      # the GitHub Actions OIDC token granted via `id-token: write` (PKG-030);
      # no publish-token secret and no publish-token environment variable are
      # configured (PKG-031). The pinned Node.js runtime bundles
      # npm >= 11.5.1, the minimum version supporting OIDC Trusted Publishing
      # (PKG-032, PKG-014).
      - name: Publish package to npm
        if: steps.branch_gate.outputs.on_master == 'true'
        run: npm publish "${{ steps.prebuilt.outputs.artifact_path }}" --ignore-scripts --provenance --access public

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: ${{ steps.prebuilt.outputs.artifact_path }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
