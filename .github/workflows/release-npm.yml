# Release (npm): ONE integrated release process — branch gate, dependency
# installation, runtime-bundle build, artifact packing, npm publish, changelog,
# GitHub Release — all in a single workflow job (PKG-027). Triggered only by
# canonical version tags (PKG-008); branch pushes and pull requests never start
# it. The branch gate is the first step of this job: it resolves the tagged
# commit's reachability from origin/master and origin/develop (PKG-009) and
# fails the run before any install, build, pack, publish, or release-creation
# step when neither branch contains the tag (PKG-028).
#
# This automation BUILDS the release artifact from the tagged sources: `npm ci`
# installs the locked dependency tree and `npm run build` compiles the single
# runtime entry `src/cli.ts` into `dist/cli.js` (PKG-110, PKG-111). `npm pack
# --ignore-scripts` then packs that freshly built tree without triggering a
# second build, and `tools/check-release-artifacts.mjs` validates the packed
# payload offline before publication and release creation (PKG-113).
#
# npm publication runs only when the tag is reachable from origin/master
# (PKG-042); tags reachable from develop but not master pack, validate, and
# create the GitHub Release without publishing to npm (PKG-043). npm
# publication disables lifecycle scripts (PKG-112), so `prepublishOnly` never
# rebuilds inside automation; authentication uses OIDC Trusted Publishing
# (PKG-010): the job grants `id-token: write` (PKG-030), no publish-token secret
# or publish-token environment variable is configured (PKG-031), and the pinned
# Node.js runtime bundles npm >= 11.5.1, the OIDC Trusted Publishing floor
# (PKG-032).
name: Release (npm)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version push (e.g. v1.2.3), no pre-release

permissions:
  contents: write
  id-token: write  # Required for npm OIDC Trusted Publishing (PKG-030)
  attestations: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  # Single integrated release process (PKG-027): the branch gate, artifact
  # packing, npm publish, changelog, and GitHub Release all run in this one
  # job — no parallel or separate release jobs exist.
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Branch gate (PKG-009): integrated as the first step of the single
      # release job. The gate resolves the tagged commit's reachability
      # from origin/master and origin/develop and exports both outcomes as
      # step outputs consumed by the publish step. A version tag reachable
      # from neither branch fails here with exit 1, before any pack,
      # publish, or release-creation step runs (PKG-028). npm publication
      # runs only for master-reachable tags (PKG-042); develop-only tags
      # pack and create the GitHub Release without publishing to npm
      # (PKG-043).
      - name: Check tag branch (master or develop)
        id: branch_gate
        run: |
          git fetch origin master develop
          on_master=false
          on_develop=false
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            on_master=true
          fi
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/develop"; then
            on_develop=true
          fi
          echo "on_master=${on_master}" >> "$GITHUB_OUTPUT"
          echo "on_develop=${on_develop}" >> "$GITHUB_OUTPUT"
          if [ "${on_master}" = "false" ] && [ "${on_develop}" = "false" ]; then
            echo "::error::Tag ${{ github.ref }} is reachable from neither origin/master nor origin/develop. Release packing runs only for master or develop version tags (PKG-008, PKG-009, PKG-028); no artifact is packed and no release is created."
            exit 1
          fi
          if [ "${on_master}" = "true" ]; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release including npm publish (PKG-042)."
          else
            echo "📦 Tag ${{ github.ref }} is on develop branch only. Proceeding with release without npm publish (PKG-043)."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      # Dependency installation and runtime-bundle build (PKG-110, PKG-111):
      # the release artifact is built inside this job from the tagged sources.
      # `npm ci` installs the locked dependency tree (no cache, PKG-014) and
      # `npm run build` invokes the installed `tsup` compiler for the single
      # runtime entry `src/cli.ts`, emitting `dist/cli.js` (PKG-129).
      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build runtime bundle
        run: npm run build

      # Built-artifact verification (PKG-110): the freshly compiled entry MUST
      # exist and be syntactically valid before packing, so a broken compile
      # never reaches the registry.
      - name: Verify built release artifacts in dist/
        run: |
          for artifact in dist/cli.js; do
            if [ ! -s "${artifact}" ]; then
              echo "::error::Release artifact missing or empty after the build: ${artifact} (PKG-110)."
              exit 1
            fi
          done
          node --check dist/cli.js
          echo "Built dist/ artifacts verified."

      # Release asset packed once (PKG-012) from the freshly built tree
      # (PKG-111). `--ignore-scripts` keeps the `prepare` lifecycle inactive,
      # so packing never compiles a second time (PKG-111).
      - name: Pack npm tarball from the built artifacts
        run: npm pack --ignore-scripts

      # Artifact validation (PKG-113): offline checks of the packed tarball
      # against the freshly built `dist/` tree and the packaged entry point, run
      # before publication and release creation so an inconsistent artifact
      # set never reaches npm or the GitHub Release.
      - name: Validate release artifacts
        run: node tools/check-release-artifacts.mjs

      # Release asset set (PKG-126, PKG-128): the release publishes exactly the
      # one npm tarball packed from the runtime bundle built in this job.
      # Repository sources are build inputs, never release artifacts, so no
      # source archive may accompany the tarball.
      - name: Verify release asset set
        run: |
          tarballs="$(find . -maxdepth 1 -type f -name '*.tgz' -print)"
          tarball_count="$(printf '%s' "${tarballs}" | grep -c . || true)"
          if [ "${tarball_count}" -ne 1 ]; then
            echo "::error::Expected exactly one packed npm tarball (*.tgz) as the release asset, found ${tarball_count} (PKG-126, PKG-128)."
            exit 1
          fi
          source_archives="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' \) -print)"
          if [ -n "${source_archives}" ]; then
            echo "::error::Repository sources are not release artifacts; release asset set must hold only the npm tarball (PKG-126, PKG-128): ${source_archives}"
            exit 1
          fi
          echo "Release asset set verified: ${tarballs}"

      # npm publish runs only when the branch gate resolved the tag as
      # reachable from origin/master (PKG-042); develop-only tags skip this
      # step and complete the release without npm publication (PKG-043).
      # Lifecycle scripts are disabled (PKG-112), so no build runs during
      # publication and the published payload equals the freshly built artifacts.
      # npm OIDC Trusted Publishing (PKG-010): authentication is minted from
      # the GitHub Actions OIDC token granted via `id-token: write` (PKG-030);
      # no publish-token secret and no publish-token environment variable are
      # configured (PKG-031). The pinned Node.js runtime bundles
      # npm >= 11.5.1, the minimum version supporting OIDC Trusted Publishing
      # (PKG-032, PKG-014).
      - name: Publish package to npm
        if: steps.branch_gate.outputs.on_master == 'true'
        run: npm publish --ignore-scripts --provenance --access public

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: mcp-google-api-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
