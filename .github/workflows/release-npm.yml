# Release (npm): ONE integrated release process — master gate, build, pack,
# publish, changelog, GitHub Release — all in a single workflow job
# (PKG-027). Triggered only by canonical version tags (PKG-008); branch
# pushes and pull requests never start it. The master-reachability check is
# the first step of this job and fails the run before any dependency
# install, build, pack, or publish step when the tagged commit is not
# reachable from origin/master, so a tag on develop never builds
# (PKG-009, PKG-028). The package build and tarball packing run
# exclusively in this release workflow (PKG-026). No tests run in the
# release pipeline; `npm publish` runs the `prepublishOnly` lifecycle hook
# (version guard + build) defined in package.json (PKG-005). npm
# authentication uses OIDC Trusted Publishing (PKG-010): the job grants
# `id-token: write` (PKG-030), no publish-token secret or publish-token
# environment variable is configured (PKG-031), and the pinned Node.js
# runtime bundles npm >= 11.5.1, the OIDC Trusted Publishing floor (PKG-032).
name: Release (npm)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version push (e.g. v1.2.3), no pre-release

permissions:
  contents: write
  id-token: write  # Required for npm OIDC Trusted Publishing (PKG-030)
  attestations: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  # Single integrated release process (PKG-027): the branch gate, build,
  # pack, npm publish, changelog, and GitHub Release all run in this one
  # job — no parallel or separate release jobs exist.
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Master gate (PKG-009): integrated as the first step of the single
      # release job. A version tag whose commit is not reachable from
      # origin/master (e.g. a tag pushed on develop) fails here with exit 1,
      # before any dependency installation, build, pack, or publish step
      # runs (PKG-028).
      - name: Check if tag is on master
        run: |
          git fetch origin master
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release."
          else
            echo "::error::Tag ${{ github.ref }} is not reachable from origin/master. Release builds run only for master version tags (PKG-008, PKG-009, PKG-028); no build is performed."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build if present
        run: npm run build --if-present

      # Release asset packed once (PKG-012): the built npm tarball, not raw
      # sources. No tests run in the release pipeline; the development-phase
      # minimum verification stays local (PKG-019).
      - name: Pack npm tarball (release asset)
        run: npm pack

      - name: Remove private package flag
        run: npm pkg delete private

      # npm publish triggers `prepublishOnly` (version guard + build, PKG-005).
      # npm OIDC Trusted Publishing (PKG-010): authentication is minted from
      # the GitHub Actions OIDC token granted via `id-token: write` (PKG-030);
      # no publish-token secret and no publish-token environment variable are
      # configured (PKG-031). The pinned Node.js runtime bundles
      # npm >= 11.5.1, the minimum version supporting OIDC Trusted Publishing
      # (PKG-032, PKG-014).
      - name: Publish package to npm
        run: npm publish --provenance --access public

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: mcp-google-map-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
