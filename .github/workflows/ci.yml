# Continuous Integration: install + typecheck + unit tests on every push and
# pull_request, across Linux, macOS, and Windows. The package build, tarball
# packing, installed-package smoke check, and publish run exclusively in the
# tag-triggered release workflow (release-npm.yml), gated on master (PKG-026).
# Live e2e tests (tests/smoke.test.ts) are intentionally excluded: they require
# a paid GOOGLE_MAPS_API_KEY and are run manually via `npm run test:e2e`.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mocked, no API key required)
        run: npm test
