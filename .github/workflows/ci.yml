# Continuous Integration: install + typecheck + unit tests + built-tarball smoke
# on every push and pull_request, across Linux, macOS, and Windows.
# Live e2e tests (tests/smoke.test.ts) are intentionally excluded: they require
# a paid GOOGLE_MAPS_API_KEY and are run manually via `npm run test:e2e`.
# The packed tarball is installed into the runner environment (temporary
# global install) and smoke-checked with `doctor` local mode: zero Google API
# calls, so the installed package is verified without credentials.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mocked, no API key required)
        run: npm test

      - name: Build package
        run: npm run build

      - name: Pack tarball
        run: npm pack

      - name: Install packed tarball into temporary environment
        run: npm install -g ./mcp-google-map-*.tgz

      - name: Installed-package smoke test (no Google API calls)
        run: mcp-google-map doctor
        env:
          GOOGLE_MAPS_API_KEY: ci-smoke-placeholder-key
