# Release (npm): build, verify, publish to npm and create the GitHub Release,
# triggered only by canonical version tags whose commit is reachable from
# master (PKG-008, PKG-009). The package build and tarball packing run
# exclusively here, never in the CI workflow (PKG-026). Before publishing, the
# packed tarball is installed into the runner environment (temporary global
# install) and smoke-checked with `doctor` local mode: zero Google API calls,
# so the installed package is verified without credentials (PKG-021).
# Additional verification guarantee: `npm publish` runs the `prepublishOnly`
# lifecycle hook (typecheck + unit tests + build) defined in package.json
# (PKG-005).
name: Release (npm)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version push (e.g. v1.2.3), no pre-release

permissions:
  contents: write
  id-token: write  # Required for OIDC
  attestations: write

env:
  NODE_VERSION: '24.15.0'

jobs:
  # 1. Check whether the tag is on the correct branch
  check-branch:
    runs-on: ubuntu-24.04
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if tag is on master
        id: check
        run: |
          git fetch origin master
          if git branch -r --contains ${GITHUB_SHA} | grep -q "origin/master"; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release."
            echo "is_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag ${{ github.ref }} is not on master branch. Skipping release."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Build, publish, generate changelog, create GitHub Release
  build-release:
    needs: check-branch
    # Runs this job ONLY when the previous job output is 'true'
    if: needs.check-branch.outputs.is_master == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install dependencies
        run: npm ci

      - name: Build if present
        run: npm run build --if-present

      # Release-only package artifact verification (PKG-026, PKG-021): the
      # packed tarball is installed into the runner environment and smoke-checked
      # with `doctor` local mode before anything is published.
      - name: Pack npm tarball for verification
        run: npm pack

      - name: Install packed tarball into temporary environment
        run: npm install -g ./mcp-google-map-*.tgz

      - name: Installed-package smoke test (no Google API calls)
        run: mcp-google-map doctor
        env:
          GOOGLE_MAPS_API_KEY: release-smoke-placeholder-key

      - name: Remove private package flag
        run: npm pkg delete private

      # npm publish triggers `prepublishOnly` (typecheck + unit tests + build).
      - name: Publish package to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Project adaptation: the release asset is the built npm tarball, not raw sources.
      - name: Pack npm tarball (release asset)
        run: npm pack

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?(!)?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: mcp-google-map-*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
